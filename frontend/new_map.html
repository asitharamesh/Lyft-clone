<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fast CDN preconnections -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; cursor: default; background: #e5e3df; }
        .booking-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: white; padding: 25px; width: 350px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #800020; font-weight: 800; }
        .input-box { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-box input { flex: 1; padding: 12px; border: 1px solid #ddd; background: #f8f9fa; border-radius: 8px; outline: none; }
        .icon-btn { padding: 12px; background: #eee; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .icon-btn.active { background: #800020; color: white; }
        .main-btn { width: 100%; padding: 15px; background: #800020; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .status-box { text-align: center; margin-top: 20px; font-weight: 600; color: #800020; min-height: 20px; }
        #thanks-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 300px; animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .fare-detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 5px; }
        .fare-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #800020; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; }
        .fare-detail-row.order-price { font-weight: bold; color: #155724; font-size: 14px; margin-top: 8px; }
        .marker-icon { font-size: 24px; text-align: center; line-height: 24px; }
        .food-ride-panel { display: none; background: #fff8e6; border: 1px solid #ffe08a; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
        .food-ride-panel h4 { margin: 0 0 8px 0; color: #856404; font-size: 14px; }
        .food-ride-row { margin-bottom: 4px; color: #333; }
        .link-error { color: #dc3545; font-size: 12px; margin-top: 6px; display: none; }
        .main-btn:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="thanks-modal">
        <div class="modal-content">
            <div style="font-size: 50px;">🎉</div>
            <h2 style="margin: 10px 0;">Ride Completed!</h2>
            <p id="thanks-payment-msg">Thanks for paying. Book another ride?</p>
            <div style="display:flex; gap:10px;">
                <button class="main-btn" onclick="resetApp()">Yes</button>
                <button class="main-btn" style="background:#444;" onclick="logout()">No</button>
            </div>
        </div>
    </div>

    <div class="booking-panel">
        <div class="header"><h2 style="margin:0;">Lyft</h2><span onclick="logout()" style="color:red; cursor:pointer;">Logout</span></div>
        <p id="welcome-msg" style="color: #666; font-size: 13px; margin-top: -15px;">Welcome</p>
        <div style="display:flex; justify-content:space-between; align-items:center; background:#fff3cd; padding:10px; border-radius:8px; margin-bottom:15px;">
            <span style="font-size:13px;">🍔 Do you want to pick food first?</span>
            <input type="checkbox" id="food-checkbox" onchange="toggleFoodMode()" style="width:20px; height:20px;">
        </div>
        <div id="food-input" style="display:none; margin-bottom:15px;">
            <input type="text" id="swiggy-link" placeholder="Paste Link (e.g., http://lyft.com/truffles/cheese-burger)" style="width:92%; padding:10px; border:1px solid #ddd; border-radius:8px;" onblur="simulateLinkParse()">
            <div id="link-error" class="link-error"></div>
        </div>
        <div id="food-ride-panel" class="food-ride-panel"></div>
        <div class="input-box"><input type="text" id="pickup-text" value="Set Pickup (Green)" readonly><button class="icon-btn" id="btn-pickup" onclick="enablePickMode('pickup')">📍</button></div>
        <div class="input-box"><input type="text" id="drop-text" value="Set Drop (Red)" readonly><button class="icon-btn" id="btn-drop" onclick="enablePickMode('drop')">🏁</button></div>
        
        <div id="fare-box" style="display:none; background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:10px;">
            <div id="fare-details"></div>
            <div class="fare-total-row">
                <span>Total</span>
                <span id="price-val">₹0</span>
            </div>
        </div>
        
        <div style="margin-bottom:10px;">
            <select id="payment-method" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                <option value="Cash">💵 Cash</option>
                <option value="Card">💳 Card</option>
                <option value="UPI">📱 UPI</option>
            </select>
        </div>
        <button class="main-btn" id="confirm-btn" onclick="requestRide()">Confirm Ride</button>
        <div class="status-box" id="status-text">Select Pickup 📍 & Drop 🏁 on Map</div>
    </div>
    <div id="map"></div>

    <!-- Fast CDNs for Leaflet and Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const userStr = sessionStorage.getItem('user') || sessionStorage.getItem('driver');
        const userToken = sessionStorage.getItem('user_token') || sessionStorage.getItem('driver_token');
        const userType = sessionStorage.getItem('user_type');

        if (!userStr || !userToken) {
            window.location.href = 'login.html';
        } else if (userType === 'driver') {
            window.location.href = 'driver.html';
        }

        const currentUser = JSON.parse(userStr);
        document.getElementById('welcome-msg').innerText = `Hello, ${currentUser.name}`;

        function logout() { 
            sessionStorage.removeItem('user'); 
            sessionStorage.removeItem('user_token'); 
            sessionStorage.removeItem('driver'); 
            sessionStorage.removeItem('driver_token'); 
            sessionStorage.removeItem('user_type'); 
            window.location.href = 'login.html'; 
        }

        // Fast local map setup with Canvas acceleration
        const map = L.map('map', { preferCanvas: true, fadeAnimation: false, zoomControl: true }).setView([12.9716, 77.5946], 13);
        
        // Fast CartoDB Tiles with caching & pre-fetching
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            updateWhenIdle: false,
            updateWhenZooming: false,
            keepBuffer: 4
        }).addTo(map);

        // Immediate recalculation of map container size
        const forceResize = () => map.invalidateSize();
        requestAnimationFrame(forceResize);
        window.addEventListener('load', forceResize);

        const backendBaseUrl = (window.__BACKEND_URL__ || 'http://127.0.0.1:5001').replace(/\/$/, '');
        const socket = io(backendBaseUrl, { transports: ['websocket'], auth: { token: userToken } });

        const greenIcon = L.divIcon({ html: '🟢', className: 'marker-icon', iconSize: [24, 24] });
        const redIcon = L.divIcon({ html: '🔴', className: 'marker-icon', iconSize: [24, 24] });
        const carIcon = L.divIcon({ html: '🚖', className: 'marker-icon', iconSize: [30, 30] });

        let pickupCoords=null, dropCoords=null, restaurantCoords=null, restaurantName=null, pickupMarker=null, dropMarker=null, restMarker=null, pickMode=null, myDriverId=null, routeLine=null;
        const markers={};
        let foodOrder = null;
        let foodOrderPrice = 0;
        let rideActive = false;
        let awaitingPayment = false;
        let confirmedFare = 0;

        function enablePickMode(mode) { 
            pickMode = mode; 
            document.getElementById('map').style.cursor = 'crosshair'; 
            document.getElementById('status-text').innerText = `Click on the Map to set ${mode.toUpperCase()}!`; 
            
            document.getElementById('btn-pickup').classList.toggle('active', mode === 'pickup');
            document.getElementById('btn-drop').classList.toggle('active', mode === 'drop');
        }

        map.on('click', function(e) {
            if (!pickMode) return;
            const { lat, lng } = e.latlng;
            
            if (pickMode === 'pickup') { 
                pickupCoords = [lat, lng]; 
                if(pickupMarker) map.removeLayer(pickupMarker); 
                pickupMarker = L.marker([lat, lng], { icon: greenIcon }).addTo(map); 
                document.getElementById('pickup-text').value = `Pickup: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }
            else if (pickMode === 'drop') { 
                dropCoords = [lat, lng]; 
                if(dropMarker) map.removeLayer(dropMarker); 
                dropMarker = L.marker([lat, lng], { icon: redIcon }).addTo(map); 
                document.getElementById('drop-text').value = `Drop: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                calculateFare();
                drawRoutePolyline();
            }

            document.getElementById('btn-pickup').classList.remove('active');
            document.getElementById('btn-drop').classList.remove('active');
            pickMode = null; 
            document.getElementById('map').style.cursor = 'default'; 
        });

        async function drawRoutePolyline() {
            if (!pickupCoords || !dropCoords) return;
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${dropCoords[1]},${dropCoords[0]}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes[0]) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (routeLine) map.removeLayer(routeLine);
                    routeLine = L.polyline(coords, { color: '#800020', weight: 5, opacity: 0.8 }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }
            } catch (e) {
                console.log("OSRM route fetch error", e);
            }
        }

        function formatFoodOrder(order) {
            if (!order) return '—';
            if (Array.isArray(order)) {
                return order.map(i => `${i.item} (₹${Math.round(i.price)})`).join(', ');
            }
            return String(order);
        }

        function showFoodRidePanel(data) {
            const panel = document.getElementById('food-ride-panel');
            if (!data.is_food_ride && !data.restaurant) {
                panel.style.display = 'none';
                return;
            }
            const restName = (data.restaurant && data.restaurant.name) || restaurantName || 'Restaurant';
            const orderText = formatFoodOrder(data.food_order || foodOrder);
            const orderPrice = data.food_order_price || foodOrderPrice || 0;
            const fare = Math.round(data.fare || confirmedFare || 0);
            panel.innerHTML = `
                <h4>🍔 Food Delivery Ride</h4>
                <div class="food-ride-row"><b>From (Restaurant):</b> ${restName}</div>
                <div class="food-ride-row"><b>To (Drop):</b> ${data.drop_name || document.getElementById('drop-text').value}</div>
                <div class="food-ride-row"><b>Pickup:</b> ${data.pickup_name || document.getElementById('pickup-text').value}</div>
                <div class="food-ride-row"><b>Order:</b> ${orderText}</div>
                <div class="food-ride-row"><b>Food Cost:</b> ₹${Math.round(orderPrice)}</div>
                <div class="food-ride-row" style="font-weight:bold;color:#800020;margin-top:6px;"><b>Total Fare:</b> ₹${fare}</div>
            `;
            panel.style.display = 'block';
        }

        function setRideActive(active) {
            rideActive = active;
            document.getElementById('confirm-btn').disabled = active || awaitingPayment;
        }

        function toggleFoodMode() { 
            const isFood = document.getElementById('food-checkbox').checked; 
            document.getElementById('food-input').style.display = isFood ? 'block' : 'none'; 
            if (!isFood) {
                foodOrder = null; foodOrderPrice = 0; restaurantCoords = null; restaurantName = null;
                if (restMarker) map.removeLayer(restMarker);
                document.getElementById('swiggy-link').value = "";
                document.getElementById('link-error').style.display = 'none';
                document.getElementById('status-text').innerText = "Ready";
            }
            calculateFare(); 
        }

        async function simulateLinkParse() {
            const linkError = document.getElementById('link-error');
            linkError.style.display = 'none';
            linkError.innerText = '';

            if (!pickupCoords) {
                document.getElementById('status-text').innerText = "Set Pickup location first!";
                return;
            }
            const linkInput = document.getElementById('swiggy-link').value.trim();
            if (!linkInput) return;

            try {
                const response = await fetch(`${backendBaseUrl}/api/menu`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ link: linkInput }) 
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    linkError.innerText = data.message || 'Invalid order link. Please check and try again.';
                    linkError.style.display = 'block';
                    foodOrder = null; foodOrderPrice = 0; restaurantCoords = null; restaurantName = null;
                    if (restMarker) map.removeLayer(restMarker);
                    document.getElementById('status-text').innerText = '❌ Could not load food order';
                    calculateFare();
                    return;
                }
                restaurantCoords = [data.restaurant.lat, data.restaurant.lng];
                restaurantName = data.restaurant.name;
                if (restMarker) map.removeLayer(restMarker);
                restMarker = L.marker(restaurantCoords, { icon: L.divIcon({ html: '🍔', className: 'marker-icon' }) }).addTo(map);
                foodOrder = data.food_order;
                foodOrderPrice = data.food_order_price;
                document.getElementById('status-text').innerText = `✅ ${restaurantName}: ${formatFoodOrder(foodOrder)} — ₹${foodOrderPrice}`; 
                calculateFare(); 
            } catch (e) {
                linkError.innerText = 'Could not reach server. Check your connection and try again.';
                linkError.style.display = 'block';
                document.getElementById('status-text').innerText = '❌ Failed to load menu';
            }
        }
        
        async function calculateFare() {
            if(!pickupCoords || !dropCoords) return;

            const isFood = document.getElementById('food-checkbox').checked && restaurantCoords && foodOrderPrice > 0;
            const payload = {
                pickup_lat: pickupCoords[0], pickup_lng: pickupCoords[1],
                drop_lat: dropCoords[0], drop_lng: dropCoords[1],
                food_order_price: isFood ? foodOrderPrice : 0
            };
            if (isFood) {
                payload.restaurant = { lat: restaurantCoords[0], lng: restaurantCoords[1], name: restaurantName };
            }

            try {
                const response = await fetch(`${backendBaseUrl}/api/fare-estimate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!data.success) return;

                let html = `<div class="fare-detail-row"><span>Base Fare</span><span>₹${data.base_fare}</span></div>`;
                html += `<div class="fare-detail-row"><span>Ride Cost (${data.distance_km} km)</span><span>₹${data.ride_km_cost}</span></div>`;
                html += `<div class="fare-detail-row"><span>Ride Fare</span><span>₹${data.ride_fare}</span></div>`;

                if (data.is_food_ride) {
                    html += `<div class="fare-detail-row order-price"><span>Food Order</span><span>₹${Math.round(data.food_order_price)}</span></div>`;
                    html += `<div class="fare-detail-row"><span>Food Pickup (${data.food_distance_km} km + surcharge)</span><span>₹${data.food_delivery_fee}</span></div>`;
                }

                document.getElementById('fare-box').style.display = 'block'; 
                document.getElementById('fare-details').innerHTML = html;
                document.getElementById('price-val').innerText = `₹${Math.round(data.total)}`;
            } catch (e) {
                console.log('Fare estimate error', e);
            }
        }

        function requestRide() {
            if (rideActive || awaitingPayment) return alert("Please wait — your current ride is still in progress.");
            if(!pickupCoords || !dropCoords) return alert("Please select Pickup 📍 and Drop 🏁 locations on the map!");

            const isFood = document.getElementById('food-checkbox').checked;
            if (isFood && (!restaurantCoords || !foodOrder || foodOrderPrice <= 0)) {
                return alert("Please paste a valid food order link first.");
            }
            
            const payload = { 
                user_id: currentUser.id, 
                pickup_lat: pickupCoords[0], pickup_lng: pickupCoords[1], 
                drop_lat: dropCoords[0], drop_lng: dropCoords[1], 
                payment_method: document.getElementById('payment-method').value,
                pickup_name: `${pickupCoords[0].toFixed(4)}, ${pickupCoords[1].toFixed(4)}`,
                drop_name: `${dropCoords[0].toFixed(4)}, ${dropCoords[1].toFixed(4)}`,
                food_order: foodOrder, food_order_price: foodOrderPrice 
            };

            if(restaurantCoords && isFood) {
                payload.restaurant = { lat: restaurantCoords[0], lng: restaurantCoords[1], name: restaurantName || "Restaurant" }; 
            }

            setRideActive(true);
            document.getElementById('status-text').innerText = "🔍 Finding Driver...";
            socket.emit('request_ride', payload);
        }

        socket.on('driver_moved', (data) => {
            if (myDriverId && data.driver_id !== myDriverId) return; 
            if(markers[data.driver_id]) markers[data.driver_id].setLatLng([data.latitude, data.longitude]);
            else markers[data.driver_id] = L.marker([data.latitude, data.longitude], {icon:carIcon}).addTo(map);
        });

        socket.on('ride_assigned', (data) => {
            if(data.success) { 
                myDriverId = data.driver.id; 
                confirmedFare = Math.round(data.fare || 0);
                document.getElementById('price-val').innerText = `₹${confirmedFare}`;
                showFoodRidePanel(data);
                const foodNote = data.is_food_ride ? ' 🍔 Food delivery ride' : '';
                document.getElementById('status-text').innerText = `✅ Driver ${data.driver.name} accepted!${foodNote} Total: ₹${confirmedFare}`; 
                for (const id in markers) {
                    if (id !== myDriverId && markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
                }
                if (!markers[myDriverId]) markers[myDriverId] = L.marker([data.driver.lat, data.driver.lng], {icon:carIcon}).addTo(map);
            } else {
                setRideActive(false);
                document.getElementById('status-text').innerText = data.message;
            }
        });
        
        socket.on('ride_progress', (data) => {
            const s = data.status, txt = document.getElementById('status-text');
            if(s==='heading_to_pickup') txt.innerText="🚕 Driver is heading to your pickup location...";
            if(s==='at_restaurant') txt.innerText="🍔 Driver arrived at the restaurant!";
            if(s==='food_picked') txt.innerText="🍔 Food picked up! Driver heading to pickup location...";
            if(s==='picked_up') txt.innerText="📍 Driver has arrived at pickup location!";
            if(s==='trip_started') txt.innerText="🚕 Trip started! Driving to destination...";
            if(s==='completed') { 
                awaitingPayment = true;
                setRideActive(true);
                const fare = Math.round(data.fare || confirmedFare || 0);
                txt.innerText=`🎉 Arrived at destination! Waiting for driver to confirm payment of ₹${fare}...`; 
                myDriverId=null;
                if (data.driver_id && markers[data.driver_id]) map.removeLayer(markers[data.driver_id]);
                if (data.driver_id) delete markers[data.driver_id];
            }
        });
        
        socket.on('payment_confirmed', (data) => {
            awaitingPayment = false;
            setRideActive(false);
            const fare = Math.round((data && data.fare) || confirmedFare || 0);
            document.getElementById('thanks-payment-msg').innerText = `Payment of ₹${fare} confirmed. Book another ride?`;
            document.getElementById('thanks-modal').style.display='flex';
        });

        function resetApp() {
            document.getElementById('thanks-modal').style.display='none'; 
            document.getElementById('status-text').innerText="Select Pickup 📍 & Drop 🏁 on Map";
            document.getElementById('food-ride-panel').style.display='none';
            document.getElementById('link-error').style.display='none';
            if(pickupMarker) map.removeLayer(pickupMarker); 
            if(dropMarker) map.removeLayer(dropMarker); 
            if(restMarker) map.removeLayer(restMarker);
            if(routeLine) map.removeLayer(routeLine);
            pickupCoords=null; dropCoords=null; restaurantCoords=null; restaurantName=null;
            foodOrder=null; foodOrderPrice=0; confirmedFare=0;
            awaitingPayment=false;
            setRideActive(false);
            document.getElementById('food-checkbox').checked = false;
            document.getElementById('food-input').style.display = 'none';
            document.getElementById('swiggy-link').value = '';
            document.getElementById('fare-box').style.display='none';
            document.getElementById('pickup-text').value = "Set Pickup (Green)";
            document.getElementById('drop-text').value = "Set Drop (Red)";
        }
    </script>
</body>
</html>
