<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyft Driver Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fast CDN preconnections -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; }
        #map { height: 100vh; width: 100%; cursor: default; background: #e5e3df; }
        .driver-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: white; padding: 25px; width: 340px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { color: #800020; font-weight: 800; margin: 0; }
        .earnings-card { background: #eef6ff; padding: 12px; border-radius: 10px; margin-top: 10px; font-weight: bold; color: #0d6efd; display: flex; justify-content: space-between; align-items: center; font-size: 15px; border: 1px solid #cce5ff; }
        .earnings-flash { font-size: 12px; color: #28a745; margin-top: 4px; min-height: 16px; }
        .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(24px); }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .status-offline { background: #e9ecef; color: #495057; }
        .status-online { background: #d4edda; color: #155724; }
        .status-box { text-align: center; margin-top: 15px; font-weight: 600; color: #800020; min-height: 20px; font-size: 14px; }
        .main-btn { width: 100%; padding: 12px; background: #800020; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 10px; }
        .main-btn:disabled { background: #aaa !important; cursor: not-allowed; }
        .accept-btn { background: #28a745 !important; }
        .reject-btn { background: #dc3545 !important; }
        .pay-btn { background: #198754 !important; font-size: 16px; padding: 14px; margin-top: 12px; }
        .pay-note { font-size: 11px; color: #666; margin-top: 4px; text-align: center; }
        .loc-btn { background: #0d6efd; margin-top: 10px; font-size: 13px; padding: 8px; }
        .offer-card { background: #fff8fa; border: 1px solid #ffccd5; padding: 12px; border-radius: 10px; margin-top: 12px; text-align: left; font-size: 13px; color: #333; }
        .offer-card h4 { margin: 0 0 8px 0; color: #800020; font-size: 15px; }
        .offer-row { margin-bottom: 5px; }
        .food-badge { background: #fff3cd; color: #856404; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-bottom: 6px; display: inline-block; }
        .marker-icon { font-size: 24px; text-align: center; line-height: 24px; }
    </style>
</head>
<body>
    <div class="driver-panel">
        <div class="header">
            <h2>Driver Portal</h2>
            <span onclick="logout()" style="color:red; cursor:pointer; font-weight:600;">Logout</span>
        </div>
        <p id="driver-name" style="color: #666; font-size: 14px; margin-top: -10px;">Logged in as Driver</p>

        <div class="earnings-card">
            <span>Total Earnings</span>
            <span id="driver-earnings">₹0</span>
        </div>
        <div id="earnings-flash" class="earnings-flash"></div>

        <div class="toggle-container">
            <span style="font-weight:600;">Online Status</span>
            <label class="switch">
                <input type="checkbox" id="online-toggle" onchange="toggleOnline()">
                <span class="slider"></span>
            </label>
        </div>

        <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: #555;">Current Status:</span>
            <span id="status-badge" class="status-badge status-offline">Offline</span>
        </div>

        <button id="set-loc-btn" class="main-btn loc-btn" onclick="enableSetLocation()">📍 Set / Move My Location on Map</button>

        <div id="offer-details" class="offer-card" style="display:none;"></div>

        <div id="offer-actions" style="display:none; margin-top:10px;">
            <button id="accept-btn" class="main-btn accept-btn" onclick="acceptRide()">Accept Ride</button>
            <button id="reject-btn" class="main-btn reject-btn" onclick="rejectRide()">Reject Ride</button>
        </div>

        <button id="collect-pay-btn" class="main-btn pay-btn" style="display:none;" onclick="confirmPaymentReceived()">💵 Confirm Payment Received</button>
        <div id="pay-note" class="pay-note" style="display:none;">Confirms you collected the fare yourself. No payment is processed in the app.</div>
        <button id="action-btn" class="main-btn" style="display:none;"></button>

        <div class="status-box" id="status-text">Set location & toggle online to receive rides</div>
    </div>

    <div id="map"></div>

    <!-- Fast CDNs for Leaflet and Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const userStr = sessionStorage.getItem('driver') || sessionStorage.getItem('user');
        const userToken = sessionStorage.getItem('driver_token') || sessionStorage.getItem('user_token');
        if (!userStr || !userToken) window.location.href = 'login.html';
        const currentUser = JSON.parse(userStr);
        document.getElementById('driver-name').innerText = `Driver: ${currentUser.name}`;

        let totalEarnings = currentUser.earnings || 0;
        document.getElementById('driver-earnings').innerText = `₹${Math.round(totalEarnings)}`;

        function logout() {
            stopHeartbeat();
            if (socket.connected) socket.emit('driver_offline', { driver_id: currentUser.id });
            socket.disconnect();
            sessionStorage.removeItem('user');
            sessionStorage.removeItem('user_token');
            sessionStorage.removeItem('driver');
            sessionStorage.removeItem('driver_token');
            sessionStorage.removeItem('user_type');
            window.location.href = 'login.html';
        }

        let driverLat = 12.9716, driverLng = 77.5946;
        let settingLocation = false;

        // Fast Leaflet setup with Canvas acceleration
        const map = L.map('map', { preferCanvas: true, fadeAnimation: false, zoomControl: true }).setView([driverLat, driverLng], 13);

        // Standard OpenStreetMap tiles: free, no API key, no watermark.
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: 'abc',
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            updateWhenIdle: false,
            updateWhenZooming: false,
            keepBuffer: 4
        }).addTo(map);

        const forceResize = () => map.invalidateSize();
        requestAnimationFrame(forceResize);
        window.addEventListener('load', forceResize);

        const backendBaseUrl = (window.__BACKEND_URL__ || 'http://127.0.0.1:5001').replace(/\/$/, '');
        const socket = io(backendBaseUrl, { transports: ['websocket'], auth: { token: userToken } });

        const driverIcon = L.divIcon({ html: '🚖', className: 'marker-icon', iconSize: [30, 30] });
        const greenIcon = L.divIcon({ html: '🟢', className: 'marker-icon', iconSize: [24, 24] });
        const redIcon = L.divIcon({ html: '🔴', className: 'marker-icon', iconSize: [24, 24] });
        const restIcon = L.divIcon({ html: '🍔', className: 'marker-icon', iconSize: [24, 24] });

        let myMarker = L.marker([driverLat, driverLng], { icon: driverIcon }).addTo(map);
        let currentRide = null;
        let rideConfirmed = false;   // true only once the server has assigned currentRide to this driver
        let routeLine = null;
        let pickupMarker = null;
        let dropMarker = null;
        let restMarker = null;

        // --- Heartbeat -------------------------------------------------------
        // While online, the page refreshes its place in the matching pool so the
        // server doesn't treat it as stale. The interval comes from the server
        // (DRIVER_HEARTBEAT_INTERVAL_SECONDS). Only one timer ever exists.
        let heartbeatSeconds = 30;
        let heartbeatTimer = null;

        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(() => {
                if (socket.connected && isOnlineToggled()) {
                    socket.emit('driver_heartbeat', { lat: driverLat, lng: driverLng });
                }
            }, heartbeatSeconds * 1000);
        }

        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function isOnlineToggled() {
            return document.getElementById('online-toggle').checked;
        }

        function setOnlineBadge(online) {
            const badge = document.getElementById('status-badge');
            badge.className = online ? 'status-badge status-online' : 'status-badge status-offline';
            badge.innerText = online ? 'Online' : 'Offline';
        }

        function goOnline() {
            socket.emit('driver_online', { driver_id: currentUser.id, lat: driverLat, lng: driverLng });
        }

        socket.on('connect', () => {
            // Reconnected while toggled online: rejoin the pool (the server refuses
            // this while a ride is active, and restores the ride via ride_state).
            if (isOnlineToggled() && !currentRide) goOnline();
        });

        socket.on('disconnect', stopHeartbeat);

        socket.on('driver_status', (data) => {
            if (data.heartbeat_interval_seconds) heartbeatSeconds = data.heartbeat_interval_seconds;
            if (data.online) {
                document.getElementById('online-toggle').checked = true;
                setOnlineBadge(true);
                if (!heartbeatTimer) startHeartbeat();
                return;
            }
            stopHeartbeat();
            if (data.reason === 'not_in_pool' && isOnlineToggled() && !currentRide) {
                // e.g. the backend restarted or this tab was suspended past the TTL.
                goOnline();
            } else if (data.reason === 'invalid_location') {
                document.getElementById('status-text').innerText = 'Set a valid location on the map to go online.';
            }
        });

        function enableSetLocation() {
            settingLocation = true;
            document.getElementById('map').style.cursor = 'crosshair';
            document.getElementById('status-text').innerText = 'Click anywhere on the map to set your position 📍';
        }

        map.on('click', function(e) {
            if (!settingLocation) return;
            const { lat, lng } = e.latlng;
            driverLat = lat;
            driverLng = lng;
            myMarker.setLatLng([driverLat, driverLng]);
            map.panTo([driverLat, driverLng]);
            settingLocation = false;
            document.getElementById('map').style.cursor = 'default';
            document.getElementById('status-text').innerText = `Location set to ${lat.toFixed(4)}, ${lng.toFixed(4)}`;

            if (isOnlineToggled() && !currentRide) {
                goOnline();
            }
        });

        function toggleOnline() {
            const isOnline = isOnlineToggled();
            const statusTxt = document.getElementById('status-text');

            if (isOnline) {
                setOnlineBadge(true);
                statusTxt.innerText = 'Waiting for ride requests...';
                goOnline();
            } else {
                stopHeartbeat();
                setOnlineBadge(false);
                statusTxt.innerText = 'Toggle online to receive rides';
                socket.emit('driver_offline', { driver_id: currentUser.id });
                if (!rideConfirmed) {
                    document.getElementById('offer-details').style.display = 'none';
                    document.getElementById('offer-actions').style.display = 'none';
                    document.getElementById('collect-pay-btn').style.display = 'none';
                    document.getElementById('pay-note').style.display = 'none';
                    document.getElementById('action-btn').style.display = 'none';
                    resetTripUI();
                }
            }
        }

        function formatFoodOrder(order) {
            if (!order) return '';
            if (Array.isArray(order)) {
                return order.map(i => `${i.item} (₹${Math.round(i.price)})`).join(', ');
            }
            return String(order);
        }

        // Rider-controlled values (names, places, food items) are only ever
        // inserted as text nodes, never parsed as HTML.
        function addRow(parent, label, value, style) {
            const row = document.createElement('div');
            row.className = 'offer-row';
            if (style) row.style.cssText = style;
            const b = document.createElement('b');
            b.textContent = `${label}:`;
            row.append(b, ` ${value}`);
            parent.appendChild(row);
        }

        function renderRideCard(data, title) {
            const riderName = data.user_name || 'Rider';
            const fareAmt = Math.round(data.fare || 0);
            const pickupName = data.pickup_name || (data.pickup ? `${data.pickup.lat.toFixed(4)}, ${data.pickup.lng.toFixed(4)}` : 'Nearby');
            const dropName = data.drop_name || (data.drop ? `${data.drop.lat.toFixed(4)}, ${data.drop.lng.toFixed(4)}` : 'Destination');

            const card = document.getElementById('offer-details');
            const heading = document.createElement('h4');
            heading.textContent = title;
            card.replaceChildren(heading);
            addRow(card, 'Rider', riderName);
            addRow(card, 'Pickup', pickupName);
            addRow(card, 'Dropoff', dropName);

            const breakdown = data.fare_breakdown || {};
            if (data.food_order || data.restaurant) {
                const badge = document.createElement('div');
                badge.className = 'food-badge';
                badge.textContent = '🍔 Food Delivery Order';
                card.appendChild(badge);
                if (data.restaurant) addRow(card, 'Restaurant', data.restaurant.name || 'Restaurant');
                if (data.food_order) {
                    addRow(card, 'Order', formatFoodOrder(data.food_order));
                    addRow(card, 'Food Cost', `₹${Math.round(data.food_order_price || 0)}`, 'font-weight:bold; color:#800020;');
                }
            }

            if (data.fare_breakdown) {
                addRow(card, 'Base Fare', `₹${Math.round(breakdown.base_fare || 0)}`);
                addRow(card, 'Ride Cost', `₹${Math.round(breakdown.ride_km_cost || 0)}`);
                addRow(card, 'Ride Fare', `₹${Math.round(breakdown.ride_fare || 0)}`);
                if (breakdown.food_distance_km) {
                    addRow(card, 'Food Pickup', `₹${Math.round(breakdown.food_delivery_fee || 0)} (${breakdown.food_distance_km} km + surcharge)`, 'font-weight:bold; color:#800020;');
                }
            }
            addRow(card, 'Total Fare', `₹${fareAmt}`, 'font-size:16px; font-weight:bold; color:#800020; margin-top:6px;');
            if (data.offer_expires_in_seconds) {
                addRow(card, 'Respond within', `${data.offer_expires_in_seconds}s`);
            }
            card.style.display = 'block';

            const pLat = data.pickup_lat || (data.pickup && data.pickup.lat);
            const pLng = data.pickup_lng || (data.pickup && data.pickup.lng);
            if (pLat && pLng) {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupMarker = L.marker([pLat, pLng], { icon: greenIcon }).addTo(map);
            }

            const dLat = data.drop_lat || (data.drop && data.drop.lat);
            const dLng = data.drop_lng || (data.drop && data.drop.lng);
            if (dLat && dLng) {
                if (dropMarker) map.removeLayer(dropMarker);
                dropMarker = L.marker([dLat, dLng], { icon: redIcon }).addTo(map);
            }

            if (data.restaurant && data.restaurant.lat != null && data.restaurant.lng != null) {
                if (restMarker) map.removeLayer(restMarker);
                restMarker = L.marker([data.restaurant.lat, data.restaurant.lng], { icon: restIcon }).addTo(map);
            }

            if (data.restaurant && data.restaurant.lat != null && data.restaurant.lng != null) {
                map.panTo([data.restaurant.lat, data.restaurant.lng]);
            } else if (pLat && pLng) {
                map.panTo([pLat, pLng]);
            }
            return fareAmt;
        }

        function handleRideOffer(data) {
            if (rideConfirmed) return;   // already on a ride
            currentRide = data;
            const fareAmt = renderRideCard(data, '🚕 New Ride Request');
            document.getElementById('status-text').innerText = `🚕 New Offer! Total Fare: ₹${fareAmt}`;
            document.getElementById('offer-actions').style.display = 'block';
        }

        socket.on('driver_request', handleRideOffer);
        socket.on('ride_offer', handleRideOffer);

        function acceptRide() {
            if (!currentRide) return;
            document.getElementById('offer-actions').style.display = 'none';
            const reqId = currentRide.request_id || currentRide.ride_id;
            socket.emit('driver_response', { request_id: reqId, accepted: true, driver_id: currentUser.id });
            socket.emit('accept_ride', { ride_id: reqId, driver_id: currentUser.id });

            // Not accepted until the server confirms with ride_assigned: another
            // driver may have won the ride, or the offer may have expired.
            document.getElementById('status-text').innerText = "Confirming ride with server...";
        }

        socket.on('ride_assigned', (data) => {
            if (!data.success || !currentRide || data.request_id !== currentRide.request_id) return;
            if (!data.driver || data.driver.id != currentUser.id) return;
            rideConfirmed = true;
            document.getElementById('status-text').innerText = currentRide.restaurant ? "Heading to Restaurant 🍔" : "Heading to Pickup Location 📍";
            drawRoute('heading_to_pickup');
        });

        socket.on('ride_accept_failed', (data) => {
            if (rideConfirmed || !currentRide || data.request_id !== currentRide.request_id) return;
            document.getElementById('offer-details').style.display = 'none';
            document.getElementById('offer-actions').style.display = 'none';
            document.getElementById('status-text').innerText = `❌ ${data.message || 'This ride is no longer available.'} Waiting for next request...`;
            resetTripUI();
        });

        socket.on('offer_expired', (data) => {
            if (rideConfirmed || !currentRide || data.request_id !== currentRide.request_id) return;
            document.getElementById('offer-details').style.display = 'none';
            document.getElementById('offer-actions').style.display = 'none';
            document.getElementById('status-text').innerText = "⌛ Offer expired. Waiting for next request...";
            resetTripUI();
        });

        function rejectRide() {
            if (!currentRide) return;
            const reqId = currentRide.request_id || currentRide.ride_id;
            socket.emit('driver_response', { request_id: reqId, accepted: false, driver_id: currentUser.id });

            document.getElementById('offer-details').style.display = 'none';
            document.getElementById('offer-actions').style.display = 'none';
            document.getElementById('status-text').innerText = "Ride Rejected ❌ Waiting for next request...";
            resetTripUI();
        }

        async function drawRouteLeg(fromLat, fromLng, toLat, toLng) {
            if (fromLat == null || fromLng == null || toLat == null || toLng == null) return;
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes[0]) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (routeLine) map.removeLayer(routeLine);
                    routeLine = L.polyline(coords, { color: '#800020', weight: 5, opacity: 0.8 }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }
            } catch (e) {
                console.log("Route fetch fallback", e);
            }
        }

        // Draws whichever leg of the trip the driver is currently on, so the
        // line always leads from where the driver actually is: to the
        // restaurant first for food orders, then to the rider's pickup, then
        // (once picked up) on to the drop-off.
        function drawRoute(status) {
            if (!currentRide) return;
            const pLat = currentRide.pickup_lat || (currentRide.pickup && currentRide.pickup.lat);
            const pLng = currentRide.pickup_lng || (currentRide.pickup && currentRide.pickup.lng);
            const dLat = currentRide.drop_lat || (currentRide.drop && currentRide.drop.lat);
            const dLng = currentRide.drop_lng || (currentRide.drop && currentRide.drop.lng);
            const rest = currentRide.restaurant;

            if (status === 'picked_up' || status === 'trip_started') {
                drawRouteLeg(pLat, pLng, dLat, dLng);
            } else if (status === 'food_picked') {
                drawRouteLeg(driverLat, driverLng, pLat, pLng);
            } else if (rest && rest.lat != null && rest.lng != null) {
                drawRouteLeg(driverLat, driverLng, rest.lat, rest.lng);
            } else {
                drawRouteLeg(driverLat, driverLng, pLat, pLng);
            }
        }

        socket.on('driver_moved', (data) => {
            if (data.driver_id == currentUser.id) {
                driverLat = data.latitude;
                driverLng = data.longitude;
                myMarker.setLatLng([driverLat, driverLng]);
            }
        });

        function applyProgress(s, fare) {
            const txt = document.getElementById('status-text');
            if (['heading_to_pickup', 'accepted', 'food_picked', 'picked_up', 'trip_started'].includes(s)) drawRoute(s);
            if (s === 'heading_to_pickup' || s === 'accepted') txt.innerText = currentRide && currentRide.restaurant ? "Heading to Restaurant 🍔" : "Heading to Pickup Location 📍";
            if (s === 'at_restaurant') txt.innerText = "At Restaurant — picking up food 🍔";
            if (s === 'food_picked') txt.innerText = "Food picked up! Heading to rider pickup 📍";
            if (s === 'picked_up') txt.innerText = "Arrived at Pickup / Rider Picked Up! 📍";
            if (s === 'trip_started') txt.innerText = "Trip Started 🚕 Driving to Dropoff";
            if (s === 'completed') {
                const fareVal = Math.round(fare || (currentRide ? currentRide.fare : 0));
                txt.innerText = `📍 Arrived at Destination! Please collect payment ₹${fareVal}.`;

                const payBtn = document.getElementById('collect-pay-btn');
                payBtn.innerText = `💵 Confirm Payment Received (₹${fareVal})`;
                payBtn.disabled = false;
                payBtn.style.display = 'block';
                document.getElementById('pay-note').style.display = 'block';
                payBtn.onclick = () => confirmPaymentReceived(fareVal);
            }
        }

        socket.on('ride_progress', (data) => applyProgress(data.status, data.fare));

        // Sent by the server on (re)connect when this driver has an open ride.
        socket.on('ride_state', (ride) => {
            currentRide = ride;
            rideConfirmed = true;
            renderRideCard(ride, '🚕 Current Ride');
            document.getElementById('offer-actions').style.display = 'none';
            drawRoute(ride.progress);
            applyProgress(ride.progress, ride.fare);
        });

        function confirmPaymentReceived(fareVal) {
            const reqId = currentRide ? (currentRide.request_id || currentRide.ride_id) : null;
            const amt = fareVal || (currentRide ? currentRide.fare : 0);

            socket.emit('payment_collected', { driver_id: currentUser.id, request_id: reqId, amount: amt });
            const payBtn = document.getElementById('collect-pay-btn');
            payBtn.disabled = true;
            document.getElementById('status-text').innerText = "Confirming payment...";
        }

        socket.on('payment_failed', (data) => {
            const payBtn = document.getElementById('collect-pay-btn');
            document.getElementById('status-text').innerText = `❌ ${data.message || 'Payment confirmation refused.'}`;
            if (data.reason === 'already_confirmed') {
                payBtn.style.display = 'none';
                document.getElementById('pay-note').style.display = 'none';
                document.getElementById('offer-details').style.display = 'none';
                resetTripUI();
            } else {
                payBtn.disabled = false;
            }
        });

        socket.on('earnings_update', (data) => {
            totalEarnings = data.total;
            document.getElementById('driver-earnings').innerText = `₹${Math.round(totalEarnings)}`;
            if (data.earned) {
                const flash = document.getElementById('earnings-flash');
                flash.innerText = `+₹${Math.round(data.earned)} earned from last ride`;
                setTimeout(() => { flash.innerText = ''; }, 5000);
            }
            if (currentRide && data.request_id === currentRide.request_id) {
                document.getElementById('collect-pay-btn').style.display = 'none';
                document.getElementById('pay-note').style.display = 'none';
                document.getElementById('offer-details').style.display = 'none';
                document.getElementById('status-text').innerText = "Payment Collected! 🎉 Waiting for new rides...";
                resetTripUI();
            }
        });

        function resetTripUI() {
            currentRide = null;
            rideConfirmed = false;
            if (pickupMarker) map.removeLayer(pickupMarker);
            if (dropMarker) map.removeLayer(dropMarker);
            if (restMarker) map.removeLayer(restMarker);
            if (routeLine) map.removeLayer(routeLine);
        }
    </script>
</body>
</html>
